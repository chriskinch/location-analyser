name: Auto Merge

on:
  # pull_request_target sources this workflow from the base branch, so a PR
  # cannot change how it gets merged. Safe here: no PR code is checked out.
  pull_request_target:
    types: [opened, reopened, closed, synchronize, labeled, unlabeled]
  # The schedule covers what the events above miss: Copilot reviews
  # (pull_request_review would run PR-supplied workflow code with write
  # access) and merges made with GITHUB_TOKEN, which trigger no further runs.
  # ponytail: up to 15 min lag after a review or merge; relay via an app token if that matters.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge

jobs:
  arm:
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge on the oldest ready PR
        uses: actions/github-script@v7
        with:
          script: |
            // PRs merge in creation order (CLAUDE.md). Only the oldest open
            // PR against main may merge, and only once it carries the
            // `automerge` label and Copilot has reviewed its latest commit.
            // The "Merge to main" ruleset then holds the merge until the
            // required checks pass and every review thread is resolved.
            // Every later PR has auto-merge switched off so it cannot jump
            // the queue.
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, base: 'main', state: 'open', sort: 'created', direction: 'asc', per_page: 100,
            });

            const setAutoMerge = async (pr, on) => {
              const method = pr.auto_merge?.merge_method;
              if (on ? method === 'merge' : !method) return;
              try {
                // Also clears a squash/rebase request before re-arming it as a merge commit.
                if (method) {
                  await github.graphql(
                    `mutation($id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $id }) { clientMutationId } }`,
                    { id: pr.node_id });
                }
                // expectedHeadOid refuses to arm a head pushed after the review check.
                // A later push re-runs this workflow (synchronize), which disarms it.
                if (on) {
                  await github.graphql(
                    `mutation($id: ID!, $oid: GitObjectID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: MERGE, expectedHeadOid: $oid }) { clientMutationId } }`,
                    { id: pr.node_id, oid: pr.head.sha });
                }
                core.info(`#${pr.number}: auto-merge ${on ? 'enabled' : 'disabled'}`);
              } catch (e) {
                core.warning(`#${pr.number}: could not ${on ? 'enable' : 'disable'} auto-merge: ${e.message}`);
              }
            };

            let blocked = false;
            for (const pr of prs) {
              if (blocked) {
                await setAutoMerge(pr, false);
                continue;
              }
              blocked = true;
              const labelled = pr.labels.some((l) => l.name === 'automerge');
              const reviews = labelled
                ? await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 })
                : [];
              const reviewed = reviews.some(
                (r) => r.user?.login === 'copilot-pull-request-reviewer[bot]' && r.commit_id === pr.head.sha
              );
              if (!labelled || !reviewed) {
                core.info(`#${pr.number} is next in line but not ready (label: ${labelled}, Copilot review of head: ${reviewed})`);
                await setAutoMerge(pr, false);
                continue;
              }
              // Auto-merge cannot be enabled on a PR that is already mergeable,
              // so try merging first and fall back to arming auto-merge.
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'merge', sha: pr.head.sha });
                core.info(`#${pr.number}: merged`);
                blocked = false;
              } catch (e) {
                core.info(`#${pr.number}: not mergeable yet (${e.message})`);
                await setAutoMerge(pr, true);
              }
            }
