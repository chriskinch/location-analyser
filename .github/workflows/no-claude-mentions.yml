name: No Claude Mentions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check-claude-mentions:
    # issue_comment fires for issues too; only run on PR comments.
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for Claude mentions
        uses: actions/github-script@v7
        with:
          script: |
            const pattern = /claude/i;
            const offenders = [];

            const check = (label, text) => {
              if (text && pattern.test(text)) {
                offenders.push(label);
              }
            };

            // Resolve the PR number across the different trigger event shapes.
            const prNumber =
              context.payload.pull_request?.number ??
              context.payload.issue?.number;

            if (!prNumber) {
              core.info('No pull request associated with this event; skipping.');
              return;
            }

            // The event payload that triggered this run.
            switch (context.eventName) {
              case 'pull_request':
                check('PR title', context.payload.pull_request.title);
                check('PR body', context.payload.pull_request.body);
                break;
              case 'issue_comment':
                check('PR comment', context.payload.comment.body);
                break;
              case 'pull_request_review':
                check('PR review', context.payload.review.body);
                break;
              case 'pull_request_review_comment':
                check('PR review comment', context.payload.comment.body);
                break;
            }

            // Always re-scan the full PR so an offending comment is still caught
            // on later runs (e.g. a synchronize event) and nothing slips through.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            check('PR title', pr.data.title);
            check('PR body', pr.data.body);

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber }
            );
            for (const c of issueComments) check(`PR comment #${c.id}`, c.body);

            const reviewComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber }
            );
            for (const c of reviewComments) check(`PR review comment #${c.id}`, c.body);

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber }
            );
            for (const r of reviews) check(`PR review #${r.id}`, r.body);

            if (offenders.length > 0) {
              const unique = [...new Set(offenders)];
              core.setFailed(
                `Found "Claude" mention(s) in: ${unique.join(', ')}. ` +
                `Please remove any mention of Claude from PR content.`
              );
            } else {
              core.info('No Claude mentions found.');
            }
